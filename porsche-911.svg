      C1090 166 1124 172 1134 196
      L1138 300
      C1140 324 1134 342 1118 344
      L947.4 346 A92 92 0 1 0 804.6 346
      L356.4 346 A92 92 0 1 0 213.6 346
      L84 346
      C62 346 54 338 52 322 Z"/>
    <clipPath id="bodyclip"><use href="#bodyp"/></clipPath>

    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34475a"/>
      <stop offset=".18" stop-color="#1f2c38"/>
      <stop offset=".42" stop-color="#101820"/>
      <stop offset=".75" stop-color="#080d12"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6379"/>
      <stop offset=".45" stop-color="#18262f"/>
      <stop offset="1" stop-color="#0a1117"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcebf6" stop-opacity="0"/>
      <stop offset=".12" stop-color="#dcebf6" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#dcebf6" stop-opacity=".18"/>
      <stop offset=".72" stop-color="#dcebf6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#dcebf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="spec" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6f7e"/>
      <stop offset=".5" stop-color="#1a232b"/>
      <stop offset="1" stop-color="#0c1116"/>
    </linearGradient>

    <path id="sp" d="M-4 -14 L-5.5 -59 L5.5 -59 L4 -14 Z"/>
    <g id="wheel">
      <circle r="84" fill="#06080b"/>
      <circle r="79" fill="#0d1318"/>
      <circle r="79" fill="none" stroke="#25313b" stroke-width="1.5"/>
      <circle r="66" fill="none" stroke="#18212a" stroke-width="2"/>
      <circle r="63" fill="#5f7282"/>
      <circle r="60" fill="#0a0f14"/>
      <circle r="50" fill="#222c34"/>
      <circle r="50" fill="none" stroke="#0c1116" stroke-width="3" stroke-dasharray="3 7"/>
