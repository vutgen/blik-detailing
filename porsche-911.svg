  <circle cx="116" cy="246" r="9" fill="#0d1620" stroke="#d8e6f1" stroke-opacity=".8" stroke-width="1.5"/>
  <circle cx="116" cy="246" r="3" fill="#fff"/>
  <path d="M138 238 C154 234 168 232 180 230" stroke="#f4f8fb" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9"/>
  <path d="M66 288 L196 280 L198 322 L62 324 Z" fill="#020406"/>
