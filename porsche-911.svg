<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380">
  <defs>
    <path id="bodyp" d="
      M52 322
      C48 298 56 268 78 248
      C84 238 90 234 98 230
      C150 212 225 188 285 178
      C330 172 372 164 404 158
      L536 70
      C548 62 570 60 600 60
      C690 58 760 64 820 84
