<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380">
  <defs>
    <path id="bodyp" d="
      M54 316
      C48 300 48 262 54 232
      C58 214 62 204 72 198
      C150 186 290 152 405 128
      C460 98 530 50 592 28
      C610 22 640 22 700 22
      C770 22 810 34 840 54
      C890 82 940 108 985 121
      C1040 124 1100 122 1134 119
      C1148 120 1152 128 1152 142
      L1150 262
      C1150 280 1146 292 1144 300
      C1146 320 1138 330 1120 330
      L987.2 330 A92 92 0 1 0 832.8 330
      L321.2 330 A92 92 0 1 0 166.8 330
      L80 330
      C62 330 56 324 54 316 Z"/>
    <clipPath id="bodyclip"><use href="#bodyp"/></clipPath>

    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5265"/>
      <stop offset=".2" stop-color="#232f3b"/>
      <stop offset=".45" stop-color="#121a22"/>
      <stop offset=".75" stop-color="#0a0f14"/>
      <stop offset="1" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56708a"/>
      <stop offset=".5" stop-color="#1c2b37"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcebf6" stop-opacity="0"/>
      <stop offset=".1" stop-color="#dcebf6" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#dcebf6" stop-opacity=".16"/>
      <stop offset=".72" stop-color="#dcebf6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#dcebf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8296a6"/>
      <stop offset=".5" stop-color="#2b3741"/>
      <stop offset="1" stop-color="#10171d"/>
    </linearGradient>

    <path id="sp" d="M-4 -14 L-5.5 -56 L5.5 -56 L4 -14 Z"/>
    <g id="wheel">
      <circle r="80" fill="#05070a"/>
      <circle r="75" fill="#0d1318"/>
      <circle r="75" fill="none" stroke="#2a3640" stroke-width="1.5"/>
      <circle r="63" fill="none" stroke="#18212a" stroke-width="2"/>
      <circle r="61" fill="#93a5b4"/>
      <circle r="58" fill="#0a0f14"/>
      <circle r="48" fill="#222c34"/>
      <circle r="48" fill="none" stroke="#0c1116" stroke-width="3" stroke-dasharray="3 7"/>
      <circle r="34" fill="#0a0f14"/>
      <path d="M8 -45 A46 46 0 0 1 45 -8 L31 -6 A31 31 0 0 0 6 -31 Z" fill="#f2b45a" stroke="#a9742a" stroke-width="1"/>
      <g fill="url(#spoke)" stroke="#9fb2c1" stroke-width=".8" stroke-opacity=".6">
        <use href="#sp"/>
        <use href="#sp" transform="rotate(36)"/><use href="#sp" transform="rotate(72)"/>
        <use href="#sp" transform="rotate(108)"/><use href="#sp" transform="rotate(144)"/>
        <use href="#sp" transform="rotate(180)"/><use href="#sp" transform="rotate(216)"/>
        <use href="#sp" transform="rotate(252)"/><use href="#sp" transform="rotate(288)"/>
        <use href="#sp" transform="rotate(324)"/>
      </g>
      <circle r="15" fill="#10171d" stroke="#8ea2b2" stroke-width="1.5"/>
      <circle r="6" fill="#c8d4dd"/>
    </g>
  </defs>

  <!-- ниши колёс -->
  <circle cx="244" cy="280" r="95" fill="#010203"/>
  <circle cx="910" cy="280" r="95" fill="#010203"/>

  <!-- кузов -->
  <use href="#bodyp" fill="url(#paint)"/>

  <g clip-path="url(#bodyclip)">
    <!-- отражение горизонта по боку -->
    <path d="M60 214 C260 186 560 160 820 166 C960 170 1080 176 1152 184 L1152 202 C1070 196 960 190 820 186 C560 182 270 206 60 238 Z" fill="url(#refl)"/>
    <!-- блик на капоте -->
    <path d="M110 196 C220 176 320 150 405 130 L405 138 C320 160 220 186 110 206 Z" fill="#dcebf6" opacity=".16"/>
    <!-- блик на багажнике -->
    <path d="M990 124 C1040 128 1100 126 1134 123 L1134 130 C1100 134 1040 136 990 132 Z" fill="#dcebf6" opacity=".18"/>
    <!-- затемнение низа -->
    <rect x="40" y="240" width="1120" height="100" fill="url(#skid)"/>
  </g>

  <!-- линии кузова -->
  <path d="M140 196 C300 168 520 146 760 144 C900 142 1040 142 1140 140" fill="none" stroke="#04070a" stroke-opacity=".7" stroke-width="2"/>
  <path d="M140 193 C300 165 520 143 760 141 C900 139 1040 139 1140 137" fill="none" stroke="#cfe0ee" stroke-opacity=".45" stroke-width="1.2"/>
  <path d="M330 262 C520 232 780 230 996 256" fill="none" stroke="#04070a" stroke-opacity=".55" stroke-width="2"/>
  <path d="M330 259 C520 229 780 227 996 253" fill="none" stroke="#cfe0ee" stroke-opacity=".22" stroke-width="1.2"/>

  <!-- контурный свет: капот, крыша, багажник -->
  <path d="M72 198 C150 186 290 152 405 128 C460 98 530 50 592 28 C610 22 640 22 700 22 C770 22 810 34 840 54 C890 82 940 108 985 121 C1040 124 1100 122 1134 119" fill="none" stroke="#cfdfec" stroke-opacity=".7" stroke-width="1.6"/>

  <!-- стёкла -->
  <path d="M440 122 L576 46 C592 40 612 38 634 38 L634 122 Z" fill="url(#glass)"/>
  <path d="M662 38 C724 38 784 46 826 62 C872 82 910 104 930 122 L662 122 Z" fill="url(#glass)"/>
  <path d="M470 112 L548 62 L566 62 L494 112 Z" fill="#fff" opacity=".11"/>
  <path d="M690 112 L736 54 L752 54 L716 112 Z" fill="#fff" opacity=".08"/>
  <!-- стойка B и чёрная окантовка -->
  <path d="M634 38 L662 38 L662 122 L634 122 Z" fill="#04070a"/>
  <g fill="none" stroke="#04070a" stroke-width="3.5">
    <path d="M440 122 L576 46 C592 40 612 38 634 38 L634 122 Z"/>
    <path d="M662 38 C724 38 784 46 826 62 C872 82 910 104 930 122 L662 122 Z"/>
  </g>
  <path d="M436 125 L936 125" stroke="#04070a" stroke-width="4"/>
  <path d="M436 128 L936 128" stroke="#cfdfec" stroke-opacity=".3" stroke-width="1"/>

  <!-- швы дверей и ручки -->
  <g fill="none" stroke="#020406" stroke-width="1.8">
    <path d="M418 140 C416 210 418 270 422 326"/>
    <path d="M648 126 C648 200 648 270 650 326"/>
    <path d="M846 132 C846 160 846 200 846 226"/>
  </g>
  <g>
    <rect x="574" y="152" width="38" height="7" rx="3.5" fill="#04070a"/>
    <rect x="574" y="152" width="38" height="2" rx="1" fill="#8ea2b2" opacity=".5"/>
    <rect x="774" y="152" width="38" height="7" rx="3.5" fill="#04070a"/>
    <rect x="774" y="152" width="38" height="2" rx="1" fill="#8ea2b2" opacity=".5"/>
  </g>

  <!-- зеркало -->
  <path d="M428 124 L474 120 C484 120 486 130 480 136 L446 142 C434 140 428 134 428 124 Z" fill="#0f1922" stroke="#b9cad6" stroke-opacity=".5"/>
  <path d="M434 126 L474 123" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>

  <!-- порог, бамперы -->
  <path d="M332 314 L828 314 L822 330 L338 330 Z" fill="#04070a"/>
  <path d="M332 314 L828 314" stroke="#a9bccb" stroke-opacity=".4" stroke-width="1.4"/>
  <path d="M54 318 L170 318 L168 330 L80 330 C62 330 56 326 54 318 Z" fill="#05080b"/>
  <path d="M996 290 L1146 292 C1146 320 1138 330 1120 330 L996 330 Z" fill="#05080b"/>
  <path d="M996 290 L1146 292" stroke="#a9bccb" stroke-opacity=".28" stroke-width="1.3"/>

  <!-- передняя часть: фара, ноздри, воздухозаборник -->
  <path d="M76 208 C112 200 160 190 202 182 L206 196 C162 206 114 218 82 228 Z" fill="#05090d" stroke="#b9cad6" stroke-opacity=".6" stroke-width="1"/>
  <path d="M96 208 C132 202 170 195 198 189" stroke="#f4f8fb" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M110 218 C140 210 168 204 196 198" stroke="#9cc4e6" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M54 236 L64 218 L66 262 L56 258 Z" fill="#020406"/>
  <path d="M56 268 L152 262 L156 306 L58 310 Z" fill="#020406"/>
  <g stroke="#2c3a46" stroke-width="1.2">
    <path d="M60 278 L152 272"/><path d="M60 290 L154 285"/><path d="M60 300 L156 297"/>
  </g>
  <path d="M142 262 L158 260 L160 308 L144 308 Z" fill="#05080b" stroke="#2c3a46" stroke-width="1"/>

  <!-- задний фонарь -->
  <path d="M1098 126 L1147 124 C1151 130 1151 152 1148 168 L1128 162 C1118 150 1108 138 1098 126 Z" fill="#b3362d"/>
  <path d="M1102 130 L1144 128" stroke="#ffc4b6" stroke-opacity=".8" stroke-width="2.2" fill="none"/>
  <path d="M1130 164 L1148 170 L1148 180 L1130 174 Z" fill="#8f2a22"/>
  <rect x="1126" y="300" width="20" height="6" rx="3" fill="#b03a30" opacity=".9"/>
  <ellipse cx="1042" cy="326" rx="22" ry="6" fill="#0b1015" stroke="#9fb4c4" stroke-width="1.5"/>

  <!-- колёса -->
  <use href="#wheel" transform="translate(244 280)"/>
  <use href="#wheel" transform="translate(910 280)"/>
</svg>
