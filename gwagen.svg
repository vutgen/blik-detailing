<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470">
  <defs>
    <path id="bodyp" d="
      M62 392
      L58 330 L60 250
      C60 215 64 195 72 190
      C140 184 240 181 335 178
      L417 24
      C421 17 429 14 440 14
      L1062 14
      C1078 14 1086 22 1087 36
      L1094 300 L1100 392
      L1006.6 392 A104 104 0 1 0 809.4 392
      L356.6 392 A104 104 0 1 0 159.4 392
      L80 392 Z"/>
    <clipPath id="bodyclip"><use href="#bodyp"/></clipPath>

    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5062"/>
      <stop offset=".12" stop-color="#26343f"/>
      <stop offset=".4" stop-color="#151f28"/>
      <stop offset=".72" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a7389"/>
      <stop offset=".5" stop-color="#1d2c37"/>
      <stop offset="1" stop-color="#0b1219"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcebf6" stop-opacity="0"/>
      <stop offset=".1" stop-color="#dcebf6" stop-opacity=".6"/>
      <stop offset=".38" stop-color="#dcebf6" stop-opacity=".16"/>
      <stop offset=".7" stop-color="#dcebf6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#dcebf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a8d9c"/>
      <stop offset=".5" stop-color="#27323b"/>
      <stop offset="1" stop-color="#10171d"/>
    </linearGradient>

    <path id="sp" d="M-5 -16 L-7 -64 L7 -64 L5 -16 Z"/>
    <g id="wheel">
      <circle r="91" fill="#05070a"/>
      <circle r="86" fill="#0d1318"/>
      <circle r="86" fill="none" stroke="#2a3640" stroke-width="1.6"/>
      <circle r="72" fill="none" stroke="#18212a" stroke-width="2"/>
      <circle r="69" fill="#6a7d8d"/>
      <circle r="65" fill="#0a0f14"/>
      <circle r="55" fill="#232d35"/>
      <circle r="55" fill="none" stroke="#0c1116" stroke-width="3" stroke-dasharray="3 7"/>
      <circle r="38" fill="#0a0f14"/>
      <path d="M9 -51 A52 52 0 0 1 51 -9 L35 -7 A35 35 0 0 0 7 -35 Z" fill="#f2b45a" stroke="#a9742a" stroke-width="1"/>
      <g fill="url(#spoke)" stroke="#8ea2b2" stroke-width=".8" stroke-opacity=".6">
        <use href="#sp"/>
        <use href="#sp" transform="rotate(36)"/><use href="#sp" transform="rotate(72)"/>
        <use href="#sp" transform="rotate(108)"/><use href="#sp" transform="rotate(144)"/>
        <use href="#sp" transform="rotate(180)"/><use href="#sp" transform="rotate(216)"/>
        <use href="#sp" transform="rotate(252)"/><use href="#sp" transform="rotate(288)"/>
        <use href="#sp" transform="rotate(324)"/>
      </g>
      <circle r="17" fill="#10171d" stroke="#8ea2b2" stroke-width="1.5"/>
      <circle r="7" fill="#c8d4dd"/>
    </g>
  </defs>

  <!-- ниши колёс -->
  <circle cx="258" cy="359" r="108" fill="#010203"/>
  <circle cx="908" cy="359" r="108" fill="#010203"/>

  <!-- запаска на задней двери -->
  <path d="M1088 190 C1128 192 1152 210 1154 250 L1154 320 C1152 346 1128 352 1094 352 Z" fill="#0a0f14"/>
  <path d="M1096 196 C1126 198 1146 212 1148 250 L1148 318 C1146 340 1126 346 1098 346" fill="none" stroke="#25313b" stroke-width="2"/>
  <path d="M1104 204 C1124 208 1138 220 1140 250" fill="none" stroke="#8ea2b2" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="1131" cy="270" r="13" fill="#141d25" stroke="#8ea2b2" stroke-opacity=".6" stroke-width="1.5"/>

  <!-- кузов -->
  <use href="#bodyp" fill="url(#paint)"/>

  <g clip-path="url(#bodyclip)">
    <!-- отражение горизонта на плечевой линии -->
    <path d="M60 196 C240 190 600 186 1090 192 L1090 214 C600 208 240 212 60 220 Z" fill="url(#refl)"/>
    <!-- мягкие вертикальные блики на дверях -->
    <path d="M388 124 L470 124 L430 372 L348 372 Z" fill="url(#streak)"/>
    <path d="M640 124 L700 124 L670 372 L610 372 Z" fill="url(#streak)"/>
    <!-- затемнение низа -->
    <rect x="40" y="270" width="1120" height="130" fill="url(#skid)"/>
  </g>

  <!-- крыша: полоска света, рейлинги -->
  <path d="M440 14 L1062 14" stroke="#cfdfec" stroke-opacity=".75" stroke-width="1.6"/>
  <path d="M72 190 C140 184 240 181 335 178" fill="none" stroke="#cfdfec" stroke-opacity=".7" stroke-width="1.6"/>
  <path d="M335 178 L417 24" stroke="#cfdfec" stroke-opacity=".4" stroke-width="1.4"/>
  <path d="M458 8 L1046 8" stroke="#0a1015" stroke-width="5" stroke-linecap="round"/>
  <path d="M458 6.5 L1046 6.5" stroke="#8ea2b2" stroke-opacity=".5" stroke-width="1"/>
  <path d="M480 8 L480 14 M1030 8 L1030 14" stroke="#0a1015" stroke-width="5"/>

  <!-- стёкла -->
  <path d="M366 124 L409 42 L598 42 L598 124 Z" fill="url(#glass)"/>
  <path d="M628 42 L826 42 L826 124 L628 124 Z" fill="url(#glass)"/>
  <path d="M850 42 L992 42 L1002 124 L850 124 Z" fill="url(#glass)"/>
  <path d="M388 112 L420 56 L450 56 L418 112 Z" fill="#fff" opacity=".1"/>
  <path d="M660 112 L690 56 L720 56 L690 112 Z" fill="#fff" opacity=".08"/>
  <g fill="none" stroke="#04070a" stroke-width="4">
    <path d="M366 124 L409 42 L598 42 L598 124 Z"/>
    <path d="M628 42 L826 42 L826 124 L628 124 Z"/>
    <path d="M850 42 L992 42 L1002 124 L850 124 Z"/>
  </g>
  <path d="M356 127 L1008 127" stroke="#04070a" stroke-width="4"/>
  <path d="M356 130 L1008 130" stroke="#cfdfec" stroke-opacity=".3" stroke-width="1"/>

  <!-- швы дверей -->
  <g fill="none" stroke="#020406" stroke-width="2">
    <path d="M346 150 L346 305"/>
    <path d="M604 130 L604 372"/>
    <path d="M832 130 L832 292"/>
    <path d="M858 132 L858 372" opacity=".0"/>
  </g>
  <path d="M347 150 L347 305" stroke="#9fb4c4" stroke-opacity=".25" stroke-width="1"/>

  <!-- ручки -->
  <g>
    <rect x="548" y="146" width="40" height="8" rx="4" fill="#04070a"/>
    <rect x="548" y="146" width="40" height="2.2" rx="1" fill="#8ea2b2" opacity=".5"/>
    <rect x="770" y="146" width="40" height="8" rx="4" fill="#04070a"/>
    <rect x="770" y="146" width="40" height="2.2" rx="1" fill="#8ea2b2" opacity=".5"/>
  </g>

  <!-- зеркало -->
  <rect x="338" y="98" width="46" height="34" rx="9" fill="#0b1219" stroke="#9fb4c4" stroke-opacity=".5"/>
  <path d="M346 106 L376 106" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- боковой поворотник и указатель на крыле -->
  <rect x="290" y="198" width="28" height="11" rx="5" fill="#f2b45a"/>
  <rect x="293" y="200" width="22" height="3" rx="1.5" fill="#fff" opacity=".6"/>
  <ellipse cx="124" cy="186" rx="14" ry="6" fill="#171f27" stroke="#9fb4c4" stroke-opacity=".6"/>
  <ellipse cx="124" cy="186" rx="8" ry="3" fill="#f2b45a"/>

  <!-- расширители арок -->
  <path d="M151 392 A112 112 0 1 1 365 392" fill="none" stroke="#080c10" stroke-width="12"/>
  <path d="M151 392 A118 118 0 1 1 365 392" fill="none" stroke="#7d91a2" stroke-opacity=".35" stroke-width="1.4"/>
  <path d="M801 392 A112 112 0 1 1 1015 392" fill="none" stroke="#080c10" stroke-width="12"/>
  <path d="M801 392 A118 118 0 1 1 1015 392" fill="none" stroke="#7d91a2" stroke-opacity=".35" stroke-width="1.4"/>

  <!-- нижние накладки и порог -->
  <path d="M358 372 L808 372 L802 392 L364 392 Z" fill="#04070a"/>
  <path d="M358 372 L808 372" stroke="#a9bccb" stroke-opacity=".4" stroke-width="1.5"/>
  <path d="M58 338 L160 338 L160 392 L62 392 Z" fill="#05080b"/>
  <path d="M58 338 L160 338" stroke="#a9bccb" stroke-opacity=".35" stroke-width="1.4"/>
  <path d="M1008 342 L1098 342 L1100 392 L1008 392 Z" fill="#05080b"/>
  <path d="M1008 342 L1098 342" stroke="#a9bccb" stroke-opacity=".3" stroke-width="1.4"/>

  <!-- передний угол: линза фары и ПТФ -->
  <ellipse cx="66" cy="232" rx="8" ry="34" fill="#dbe8f2" opacity=".85"/>
  <ellipse cx="66" cy="232" rx="4" ry="24" fill="#fff"/>
  <rect x="62" y="352" width="30" height="10" rx="4" fill="#0d1620" stroke="#9fb4c4" stroke-opacity=".5"/>

  <!-- задний фонарь -->
  <rect x="1064" y="166" width="24" height="86" rx="5" fill="#a8362d"/>
  <rect x="1068" y="170" width="6" height="78" rx="3" fill="#ffb3a3" opacity=".6"/>
  <rect x="1070" y="262" width="20" height="14" rx="3" fill="#d9e4ec" opacity=".8"/>

  <!-- колёса -->
  <use href="#wheel" transform="translate(258 359)"/>
  <use href="#wheel" transform="translate(908 359)"/>
</svg>
